name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # 3. Build JAR
      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      # 4. Docker Login
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 5. Build Docker Image
      - name: Build Docker Image
        run: docker build -t bckdr/taskmanager:latest .

      # 6. Push Docker Image
      - name: Push Docker Image
        run: docker push bckdr/taskmanager:latest

      # 7. Setup Kubeconfig
      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      # 8. Deploy to Kubernetes
      - name: Apply Kubernetes Deployment
        run: kubectl apply -f spring-deployment.yml

      # 9. Restart Deployment (VERY IMPORTANT)
      - name: Restart Deployment
        run: kubectl rollout restart deployment springboot-deployment
