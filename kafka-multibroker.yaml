apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx256m -Xms256m"
          command:
            - bash
            - -c
            - |
              export KAFKA_BROKER_ID=${POD_NAME##*-}
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${POD_NAME}.kafka:9092"
              exec /etc/confluent/docker/run
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "400m"
              memory: "640Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092