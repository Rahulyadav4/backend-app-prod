# MONGODB
spring.data.mongodb.uri=mongodb://mongos:27017/taskdb?connectTimeoutMS=3000&socketTimeoutMS=5000


# FIX SDE-2: Redis cache \u2014 changed from 'simple' to 'redis'
spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# ACTUATOR \u2014 FIX SDE-1: Single clean block, removed 5 duplicates, fixed typo
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=mongo,redis
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.server.port=8080

# RESILIENCE4J \u2014 FIX SDE-2: Circuit breaker config
resilience4j.circuitbreaker.instances.mongoBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mongoBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.mongoBreaker.sliding-window-size=10

# LOGGING
logging.level.org.springframework=INFO
logging.level.org.mongodb=INFO
logging.level.com.taskmanager=DEBUG

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=task-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.taskmanager.model

kafka.topic.tasks=tasks-topic
kafka.topic.partitions=3

# CSV
csv.file.path=${CSV_FILE_PATH:tasks.csv}
csv.poll.interval=30000
