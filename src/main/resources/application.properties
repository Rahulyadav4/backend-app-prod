spring.data.mongodb.uri=mongodb://mongodb-service:27017/taskdb
# ===============================
# ACTUATOR CONFIG (for Kubernetes health checks)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


spring.redis.host=redis
spring.redis.port=6379
spring.cache.type=simple

management.endpoints.web.exposure.include=health
management.endpoints.health.show-details=always

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.server.port=8080
management.endpoint.health.probes.enabled=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readynessstate.enabled=true

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.org.mongodb=INFO